<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Medicine</title>
    <link rel="icon" href="{{ url_for('static', filename='images/ho.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <style>
        body {
            background: transparent;
            font-family: 'Roboto', sans-serif;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }
        .form-wrapper {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 8px 36px rgba(0,0,0,0.6) !important;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255, 32, 78, 0.18);
        }
        .form-label {
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 8px;
        }
        .form-control {
            background: rgba(8, 8, 20, 0.9) !important;
            border: 1px solid rgba(255, 32, 78, 0.25) !important;
            color: var(--text-primary) !important;
            border-radius: 12px !important;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: var(--c4) !important;
            box-shadow: 0 0 14px rgba(0, 34, 77, 0.35) !important;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--c2), var(--c3)) !important;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            padding: 12px 26px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="form-wrapper">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
                <button class="back-btn" onclick="history.back()">← Back</button>
                <h1 class="text-center mb-0" style="color: #A3D8FF; flex: 1;">Edit Medicine</h1>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">Medicine Name:</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ medicine.name }}" required>
                </div>

                <div class="mb-3">
                    <label for="available_dose" class="form-label">Available Dose (Quantity):</label>
                    <input type="number" class="form-control" id="available_dose" name="available_dose" value="{{ medicine.available_dose }}" required>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label">Price per Unit:</label>
                    <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ medicine.price }}" required>
                </div>

                <div class="mb-3">
                    <label for="side_effect" class="form-label">Side Effects (Optional):</label>
                    <textarea class="form-control" id="side_effect" name="side_effect">{{ medicine.side_effect }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary">Update Medicine</button>
                <a href="{{ url_for('store') }}" class="btn btn-secondary">Back to Store</a>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    
    <footer class="home-footer text-center text-body-secondary">
        <div class="container">
            <p class="mt-3 mb-2" style="color: var(--text-secondary);">@2026 All rights reserved to NovaCare Hospital</p>
            <p class="mb-0"><a href="#">Back to top</a></p>
        </div>
    </footer>
</body>

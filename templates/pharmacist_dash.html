<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCare Hospital - Pharmacist Profile</title>
    <link rel="icon" href="{{ url_for('static', filename='images/ho.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <style>
        body {
            background: transparent;
            font-family: 'Roboto', sans-serif;
        }
        .profile-container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-bg);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            padding: 30px;
        }
        .profile-container h1 {
            color: #A3D8FF;
            text-align: center;
            margin-bottom: 20px;
            animation: textGlow 3s ease-in-out infinite;
            transition: all 0.4s ease;
        }
        footer {
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid">
                <a href="/pharmacist_dash" title="NovaCare Hospital Home">
                  <img src="{{ url_for('static', filename='images/hosp.png') }}" alt="Hospital Logo" class="hero-logo">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'pharmacist_dashboard' %}active{% endif %}" href="/pharmacist_dash">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'prescribe' %}active{% endif %}" href="/prescribe">Prescribe</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'store' %}active{% endif %}" href="/store">Store</a>
                        </li>
                    </ul>
                    <div class="d-flex ms-auto gap-2 align-items-center">
                        <a href="/other_logout" class="btn btn-outline-danger">Logout</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- User Info -->
    <div class="profile-container">
        <h1>Information Assigned By Admin</h1>
        <div class="mb-3">
            <label class="form-label"><strong>Name:</strong></label>
            <p class="form-control">{{user.name}}</p>
        </div>
        <div class="mb-3">
            <label class="form-label"><strong>Role:</strong></label>
            <p class="form-control">{{user.role}}</p>
        </div>
        <div class="mb-3">
            <label class="form-label"><strong>Email:</strong></label>
            <p class="form-control">{{user.email}}</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="home-footer text-center text-body-secondary">
        <div class="container">
            <p class="mt-3 mb-2" style="color: var(--text-secondary);">@2026 All rights reserved to NovaCare Hospital</p>
            <p class="mb-0"><a href="#">Back to top</a></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAJXtC2sI7zV9i3zE94q1m6Pq1m"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-w76A6HjNHK6MeuKp3gI5F8zT8K1l7Jx8cx5WQ3rV+6bA/R3SRh5Fpe3u6v0nTkB"
        crossorigin="anonymous"></script>
    
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Form</title>
    <link rel="icon" href="{{ url_for('static', filename='images/ho.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <style>
        /* Reset and body styling */
        body {
            font-family: 'Roboto', sans-serif;
            background: transparent;
            margin: 0;
            padding: 0;
        }

        /* Center the container on the page */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        /* Form container styling */
        .form-wrapper {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 8px 36px rgba(0,0,0,0.6) !important;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255, 32, 78, 0.18);
        }

        /* Heading style */
        h2 {
            margin-bottom: 20px;
            font-size: 28px;
            color: #A3D8FF;
            text-align: center;
        }

        /* Input group container */
        .input-group {
            margin-bottom: 20px;
        }

        /* Label styling */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Input field styling */
        input[type="text"],
        input[type="date"],
        input[type="time"],
        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid rgba(255, 32, 78, 0.25);
            border-radius: 12px;
            background: rgba(8, 8, 20, 0.9) !important;
            color: var(--text-primary) !important;
            transition: all 0.3s ease;
            appearance: none;
        }

        input[type="date"],
        input[type="time"] {
            appearance: auto;
        }

        select {
            background-color: rgba(8, 8, 20, 0.9) !important;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23A3D8FF"><path d="M7 10l5 5 5-5H7z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px 16px;
            padding-right: 40px;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="time"]:focus,
        select:focus {
            border-color: var(--c4);
            outline: none;
            box-shadow: 0 0 14px rgba(0, 34, 77, 0.35);
        }

        /* Submit button styling */
        .submit-btn button {
            background: linear-gradient(135deg, var(--c2), var(--c3)) !important;
            color: #fff;
            font-size: 16px;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-weight: 700;
        }

        /* Submit button hover effect */
        .submit-btn button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 22px rgba(160, 21, 62, 0.5);
        }

        /* Styling for improved accessibility */
        .input-group label {
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-wrapper">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
                <button class="back-btn" onclick="history.back()">← Back</button>
                <h2 class="mb-0" style="color: #A3D8FF; flex: 1; text-align: center;">Book an Appointment</h2>
            </div>
            <form action="/appointment_form" method="POST">
                <!-- Patient Email (Hidden Field) -->
                <!-- <input type="hidden" id="user_email" name="user_email" value="{{ user.email }}"> -->

                <!-- Doctor Email Dropdown -->
                <div class="input-group">
                    <label for="doc_email">Select Doctor:</label>
                    <select id="doc_email" name="doc_email" required>
                        <option value="" disabled selected>Select a Doctor</option>
                        {% for doctor in doctors %}
                        <option value="{{ doctor.email }}">Dr. {{ doctor.name }} ({{ doctor.specialization }})</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Day -->
                <div class="input-group">
                    <label for="day">Day:</label>
                    <input type="text" id="day" name="day" required placeholder="Enter the Day">
                </div>

                <!-- Appointment Date -->
                <div class="input-group">
                    <label for="appointment_date">Appointment Date:</label>
                    <input type="date" id="appointment_date" name="appointment_date" required>
                </div>

                <!-- Appointment Time -->
                <div class="input-group">
                    <label for="appointment_time">Appointment Time:</label>
                    <input type="text" id="appointment_time" name="appointment_time" required placeholder="Enter time (e.g., 10:00 AM)">
                </div>

                <!-- Submit Button -->
                <div class="submit-btn">
                    <button type="submit">Book Appointment</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <footer class="home-footer text-center text-body-secondary">
        <div class="container">
            <p class="mt-3 mb-2" style="color: var(--text-secondary);">@2026 All rights reserved to NovaCare Hospital</p>
            <p class="mb-0"><a href="#">Back to top</a></p>
        </div>
    </footer>

</html>

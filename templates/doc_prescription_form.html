<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Prescription Form</title>
    <link rel="icon" href="{{ url_for('static', filename='images/ho.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <style>
        body {
            background: transparent;
            font-family: 'Roboto', sans-serif;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }
        .form-wrapper {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 8px 36px rgba(0,0,0,0.6) !important;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255, 32, 78, 0.18);
        }
        .form-wrapper h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #A3D8FF;
            text-align: center;
        }
        .form-label {
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 8px;
        }
        .form-control, .form-select {
            background: rgba(8, 8, 20, 0.9) !important;
            border: 1px solid rgba(255, 32, 78, 0.25) !important;
            color: var(--text-primary) !important;
            border-radius: 12px !important;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--c4) !important;
            box-shadow: 0 0 14px rgba(0, 34, 77, 0.35) !important;
            outline: none;
        }
        .form-select {
            appearance: none;
            background-color: rgba(8, 8, 20, 0.9) !important;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23A3D8FF"><path d="M7 10l5 5 5-5H7z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px 16px;
            padding-right: 40px;
        }
        input[type="date"], input[type="time"] {
            appearance: auto;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--c2), var(--c3)) !important;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            padding: 12px 26px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 22px rgba(160, 21, 62, 0.4);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="form-wrapper">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
                <button class="back-btn" onclick="history.back()">← Back</button>
                <h2 class="mb-0" style="color: #A3D8FF; flex: 1; text-align: center;">Prescription Form</h2>
            </div>
            <form method="POST" action="/doc_prescription_form">
                <!-- Patient Email Input -->
                <div class="mb-3">
                    <label for="patient_email" class="form-label">Patient Email</label>
                    <select class="form-control" id="patient_email" name="patient_email" required>
                        <option value="" disabled selected>Select a patient</option>
                        {% for email in patient_emails %}
                        <option value="{{ email }}">{{ email }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Prescription Text Input -->
                <div class="mb-3">
                    <label for="prescription_text" class="form-label">Prescription Text</label>
                    <textarea class="form-control" id="prescription_text" name="prescription_text" rows="5" required></textarea>
                </div>

                <!-- Date Input for Pharmacist Notes -->
                <div class="mb-3">
                    <label for="pharmacist_text" class="form-label">Date</label>
                    <input type="date" class="form-control" id="pharmacist_text" name="pharmacist_text" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">Submit Prescription</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    
    <footer class="home-footer text-center text-body-secondary">
        <div class="container">
            <p class="mt-3 mb-2" style="color: var(--text-secondary);">@2026 All rights reserved to NovaCare Hospital</p>
            <p class="mb-0"><a href="#">Back to top</a></p>
        </div>
    </footer>
</body>
